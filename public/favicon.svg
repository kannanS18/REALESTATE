<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="solisGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <radialGradient id="solisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#0B0D13" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Curved Base -->
  <rect width="64" height="64" rx="14" fill="#07090E" />
  <rect width="64" height="64" rx="14" fill="none" stroke="url(#solisGoldGrad)" stroke-width="1.2" stroke-opacity="0.4" />
  
  <!-- Subtle Ambient Core Solar Glow -->
  <circle cx="32" cy="32" r="24" fill="url(#solisGlow)" />

  <!-- Outer Architectural Diamond Frame -->
  <polygon points="32,8 54,32 32,56 10,32" fill="none" stroke="url(#solisGoldGrad)" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Inner Architectural Diamond Accent -->
  <polygon points="32,16 46,32 32,48 18,32" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />

  <!-- Solis Solar Rays (Cardinal Lines) -->
  <line x1="32" y1="12" x2="32" y2="52" stroke="url(#solisGoldGrad)" stroke-width="1.8" stroke-linecap="round" />
  <line x1="12" y1="32" x2="52" y2="32" stroke="url(#solisGoldGrad)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Central Solis Sun Disc & Ring -->
  <circle cx="32" cy="32" r="6" fill="#07090E" stroke="url(#solisGoldGrad)" stroke-width="1.6" />
  <circle cx="32" cy="32" r="2.5" fill="url(#solisGoldGrad)" />

  <!-- Precision Cornerstone Studs -->
  <circle cx="32" cy="8" r="1.8" fill="#FFF2A3" />
  <circle cx="54" cy="32" r="1.8" fill="#D4AF37" />
  <circle cx="32" cy="56" r="1.8" fill="#AA7C11" />
  <circle cx="10" cy="32" r="1.8" fill="#D4AF37" />
</svg>
