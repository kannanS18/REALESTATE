<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="auraGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0B0D13" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Curved Base -->
  <rect width="64" height="64" rx="14" fill="#07090E" />
  <rect width="64" height="64" rx="14" fill="none" stroke="url(#auraGoldGrad)" stroke-width="1.2" stroke-opacity="0.4" />
  
  <!-- Subtle Ambient Core Glow -->
  <circle cx="32" cy="32" r="24" fill="url(#auraGlow)" />

  <!-- Sovereign Architectural Diamond & Pavilion 'A' Monogram -->
  <!-- Outer Architectural Diamond Frame -->
  <polygon points="32,8 54,32 32,56 10,32" fill="none" stroke="url(#auraGoldGrad)" stroke-width="1.8" stroke-linejoin="round" />

  <!-- Inner Architectural Monogram Apex (A & P Motif) -->
  <polygon points="32,15 44,32 32,49 20,32" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1" />

  <!-- Central 24k Gold Pillar & Horizon Beam -->
  <line x1="32" y1="18" x2="32" y2="46" stroke="url(#auraGoldGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="35" x2="42" y2="35" stroke="url(#auraGoldGrad)" stroke-width="1.6" stroke-linecap="round" />

  <!-- Precision Cornerstone Studs -->
  <circle cx="32" cy="8" r="1.8" fill="#FFF2A3" />
  <circle cx="54" cy="32" r="1.8" fill="#D4AF37" />
  <circle cx="32" cy="56" r="1.8" fill="#AA7C11" />
  <circle cx="10" cy="32" r="1.8" fill="#D4AF37" />
</svg>
