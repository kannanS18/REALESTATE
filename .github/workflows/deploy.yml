name: Deploy Dual Sites to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main_site

      - name: Checkout sabu branch
        uses: actions/checkout@v4
        with:
          ref: sabu
          path: sabu_site

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: main_site/package-lock.json

      - name: Build Main Site (Public Demo at /)
        working-directory: main_site
        run: |
          npm ci
          VITE_BASE_PATH=/REALESTATE/ npm run build

      - name: Build Sabu Site (Personal Graphify at /sabu/)
        working-directory: sabu_site
        run: |
          npm ci
          VITE_BASE_PATH=/REALESTATE/sabu/ npm run build

      - name: Combine Both Sites into Unified Output
        run: |
          mkdir -p output
          cp -r main_site/dist/* output/
          mkdir -p output/sabu
          cp -r sabu_site/dist/* output/sabu/
          touch output/.nojekyll
          cp main_site/dist/index.html output/404.html
          cp sabu_site/dist/index.html output/sabu/404.html

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
